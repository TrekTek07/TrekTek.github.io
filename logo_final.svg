  <circle cx="1000" cy="1050" r="530" fill="none" stroke="#D4AF37" stroke-width="2" stroke-dasharray="12,9" opacity="0.5"/>

  <!-- Cardinal stars -->
  <text x="1000" y="484" text-anchor="middle" font-family="Georgia, serif" font-size="38" fill="#D4AF37">★</text>
