<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grant Intelligence Results</title><link rel="stylesheet" href="style.css"><style>
body{margin:0;background:#050b18;color:#e5e7eb;font-family:Arial,sans-serif}.shell{max-width:1150px;margin:auto;padding:28px 20px 70px}.hero{border:1px solid #d4af37;border-radius:18px;padding:28px;background:radial-gradient(circle at top right,#172554,#07111f 55%);box-shadow:0 0 45px rgba(212,175,55,.08)}h1,h2,h3{color:#d4af37}.eyebrow{letter-spacing:.18em;text-transform:uppercase;color:#93c5fd;font-size:.78rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:18px}.card{background:#0b1220;border:1px solid #26334a;border-radius:14px;padding:18px}.choice{border-left:4px solid #d4af37}.muted{color:#94a3b8}.pill{display:inline-block;border:1px solid #d4af37;border-radius:999px;padding:5px 10px;margin:3px;font-size:.8rem}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}.btn{padding:11px 16px;border-radius:8px;text-decoration:none;font-weight:700;background:#d4af37;color:#050b18;border:0;cursor:pointer}.btn.secondary{background:#172033;color:#fff;border:1px solid #d4af37}pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#cbd5e1}</style></head><body><div class="shell"><div class="hero"><div class="eyebrow">Grant Intelligence™ • Five Opportunity Choice</div><h1 id="headline">Your Funding Intelligence Report</h1><p id="summary" class="muted">Loading validated results…</p><div id="meta"></div><div class="actions"><a class="btn secondary" href="premium.html">New Analysis</a><button class="btn" onclick="window.print()">Print / Save PDF</button></div></div><section><h2>Verified Funding Choices</h2><div id="choices" class="grid"></div></section><section><h2>Documented Strengths</h2><div id="strengths" class="grid"></div></section><section><h2>Development Gaps & Next Steps</h2><div id="next" class="grid"></div></section><section><h2>Validated Output</h2><div class="card"><pre id="raw"></pre></div></section></div><script>
(function(){const raw=sessionStorage.getItem('giLatestResult');if(!raw){document.getElementById('summary').textContent='No completed website analysis is stored in this browser yet.';return}let outer=JSON.parse(raw),r=outer.data||outer;for(const k of ['clientResultsRecord','client_results_record','result']){if(typeof r[k]==='string'){try{r=JSON.parse(r[k])}catch(e){}}else if(r[k]&&typeof r[k]==='object')r=r[k]}document.getElementById('headline').textContent=r.headline||'Your Funding Intelligence Report';document.getElementById('summary').textContent=r.executive_summary||'Validated Five Opportunity Choice results.';document.getElementById('meta').innerHTML='<span class="pill">Project: '+esc(r.project_id||sessionStorage.getItem('giLatestProjectId')||'—')+'</span><span class="pill">Status: '+esc(r.result_status||outer.status||'Complete')+'</span><span class="pill">Confidence: '+esc(r.client_results_confidence||'—')+'</span>';cards('choices',r.verified_funding_choices||[],x=>'<h3>'+esc(x.opportunity_name||x.title||x.name||'Verified Opportunity')+'</h3><p>'+esc(x.summary||x.description||x.why_it_fits||'')+'</p>','choice');cards('strengths',r.documented_strengths||[],x=>'<h3>'+esc(x.strength||x.title||'Strength')+'</h3><p>'+esc(x.evidence||'')+'</p><p class="muted">'+esc(x.why_it_may_matter||'')+'</p>');let combined=[...(r.development_gaps||[]),...(r.recommended_next_steps||[])];cards('next',combined,x=>typeof x==='string'?'<p>'+esc(x)+'</p>':'<h3>'+esc(x.title||x.gap||x.action||'Next Step')+'</h3><p>'+esc(x.description||x.evidence||x.reason||'')+'</p>');document.getElementById('raw').textContent=JSON.stringify(r,null,2);function cards(id,arr,render,cls=''){document.getElementById(id).innerHTML=arr.length?arr.map(x=>'<div class="card '+cls+'">'+render(x)+'</div>').join(''):'<div class="card muted">No items returned in this section.</div>'}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}})();
</script></body></html>
